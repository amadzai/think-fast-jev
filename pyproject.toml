[project]
name = "think-fast-jev"
version = "0.1.0"
description = "Benchmark single-pass decision models against a frontier LLM at the decision steps of a crypto data assistant."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "typer>=0.15",
]

[project.scripts]
bench = "bench.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 120

[tool.pyright]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]
